<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Room</title>

    <!-- Your CSS -->
    <link rel="stylesheet" href="Style.css" />

    <!-- CodeMirror CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
    />

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  </head>

  <body>
    <div class="header">Code Room</div>

    <div class="editor-container">
      <div id="editor"></div>
    </div>

    <div class="controls">
      <button onclick="compileCode()">Compile</button>
    </div>

    <pre id="output"></pre>

    <script>
      // Initialize CodeMirror editor
      const editor = CodeMirror(document.getElementById("editor"), {
        mode: "text/x-java",
        theme: "dracula",
        lineNumbers: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        indentUnit: 4,
        tabSize: 4,
        value: `public class JavaProgram {
      public static void main(String[] args) {
          System.out.println("Hello World");
      }
}`,
      });
      // Compile button function
      async function compileCode() {
        const content = editor.getValue();

        try {
          const response = await fetch("http://localhost:8080/api/compile", {
            method: "POST",
            headers: {
              "Content-Type": "text/plain",
            },
            body: content,
          });

          const result = await response.text();
          document.getElementById("output").innerText = result;
        } catch (err) {
          document.getElementById("output").innerText = "Error: " + err;
        }
      }

      const socket = new WebSocket("ws://localhost:8080/ws");
      let isRemoteUpdate = false;

      // Receive updates
      socket.onmessage = (event) => {
        const incoming = event.data;

        // update editor (be careful: this replaces content)
        isRemoteUpdate = true;
        editor.setValue(incoming);
        isRemoteUpdate = false;
      };

      // Send changes
      editor.on("change", () => {
        if (isRemoteUpdate) {
          return;
        }
        const content = editor.getValue();
        socket.send(content);
      });
    </script>
  </body>
</html>
