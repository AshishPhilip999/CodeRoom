<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Room</title>

    <!-- Your CSS -->
    <link rel="stylesheet" href="Style.css" />

    <!-- CodeMirror CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
    />

    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  </head>

  <body>
    <div class="header">Code Room</div>

    <div class="editor-container">
      <div id="editor"></div>
    </div>

    <div class="controls">
      <button onclick="compileCode()">Compile</button>
    </div>

    <pre id="output"></pre>

    <script>
      let serverHost = "localhost";
      let port = "8080";

      // Initialize CodeMirror editor
      const editor = CodeMirror(document.getElementById("editor"), {
        mode: "text/x-java",
        theme: "dracula",
        lineNumbers: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        indentUnit: 4,
        tabSize: 4,
        value: `public class JavaProgram {
      public static void main(String[] args) {
          System.out.println("Hello World");
      }
}`,
      });
      // Compile button function
      async function compileCode() {
        const content = editor.getValue();

        try {
          const response = await fetch(
            `http://${serverHost}:${port}/api/compile`,
            {
              method: "POST",
              headers: {
                "Content-Type": "text/plain",
              },
              body: content,
            },
          );

          const result = await response.text();
          document.getElementById("output").innerText = result;
        } catch (err) {
          document.getElementById("output").innerText = "Error: " + err;
        }
      }

      const socket = new WebSocket(`ws://${serverHost}:${port}/ws`);
      let isRemoteUpdate = false;

      // Receive updates
      socket.onmessage = (event) => {
        isRemoteUpdate = true;
        const data = JSON.parse(event.data);
        applyChange(data);
        isRemoteUpdate = false;
      };

      function applyChange(change) {
        const doc = editor.getDoc();

        if (change.type === "insert") {
          const pos = doc.posFromIndex(change.index);
          doc.replaceRange(change.value, pos);
        }

        if (change.type === "delete") {
          const from = doc.posFromIndex(change.index);
          const to = doc.posFromIndex(change.index + change.length);
          doc.replaceRange("", from, to);
        }
      }

      // Send changes
      editor.on("change", (instance, changeObj) => {
        if (isRemoteUpdate) {
          return;
        }
        const from = changeObj.from; // {line, ch}
        const to = changeObj.to;
        const text = changeObj.text.join("\n"); // inserted text
        const removed = changeObj.removed.join("\n");

        // Convert position → index
        const index = instance.indexFromPos(from);

        let payload;

        if (text && text.length > 0) {
          // INSERT
          payload = {
            type: "insert",
            index: index,
            value: text,
          };
        } else {
          // DELETE
          payload = {
            type: "delete",
            index: index,
            length: removed.length,
          };
        }

        socket.send(JSON.stringify(payload));
      });
    </script>
  </body>
</html>
