<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Code Room</title>

    <link rel="stylesheet" href="Style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  </head>

  <body>
    <div class="header">Code Room</div>

    <!-- ROOM CONTROLS -->
    <div class="controls">
      <!-- NOT IN ROOM -->
      <div id="roomActions">
        <button onclick="createRoom()">Create Room</button>

        <input id="roomInput" placeholder="Enter Room ID" />
        <button onclick="joinRoom()">Join Room</button>
      </div>

      <!-- IN ROOM -->
      <div id="inRoomActions" style="display: none">
        <button onclick="leaveRoom()">Leave Room</button>
      </div>

      <!-- STATUS -->
      <span id="status" style="margin-left: 10px; color: #22c55e">
        Not in any room
      </span>
    </div>

    <div class="editor-container">
      <div id="editor"></div>
    </div>

    <div class="controls">
      <button onclick="compileCode()">Compile</button>
    </div>

    <pre id="output"></pre>

    <script>
      let serverHost = "localhost";
      let port = "8080";

      let joined = false;
      let currentRoom = null;

      const editor = CodeMirror(document.getElementById("editor"), {
        mode: "text/x-java",
        theme: "dracula",
        lineNumbers: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        indentUnit: 4,
        tabSize: 4,
        value: `public class JavaProgram {
      public static void main(String[] args) {
          System.out.println("Hello World");
      }
}`,
      });

      // ===============================
      // UI TOGGLE
      // ===============================
      function updateUI() {
        document.getElementById("roomActions").style.display = joined
          ? "none"
          : "block";
        document.getElementById("inRoomActions").style.display = joined
          ? "block"
          : "none";

        document.getElementById("status").innerText = joined
          ? "In Room: " + currentRoom
          : "Not in any room";
      }

      // ===============================
      // ROOM FUNCTIONS
      // ===============================
      function createRoom() {
        const roomId = generateUUID();

        socket.send(
          JSON.stringify({
            type: "create",
            roomID: roomId,
          }),
        );

        // if success only then update UI

        joined = true;
        currentRoom = roomId;

        updateUI();
      }

      function generateUUID() {
        if (crypto && crypto.randomUUID) {
          return crypto.randomUUID();
        }

        // Fallback (works everywhere)
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
          /[xy]/g,
          function (c) {
            const r = (Math.random() * 16) | 0;
            const v = c === "x" ? r : (r & 0x3) | 0x8;
            return v.toString(16);
          },
        );
      }

      function joinRoom() {
        const roomId = document.getElementById("roomInput").value;

        if (!roomId) {
          alert("Enter Room ID");
          return;
        }

        socket.send(
          JSON.stringify({
            type: "join",
            roomID: roomId,
          }),
        );

        // If success only then update UI

        joined = true;
        currentRoom = roomId;

        updateUI();
      }

      function leaveRoom() {
        if (!joined) return;

        // Optional: notify backend
        socket.send(
          JSON.stringify({
            type: "leave",
            roomID: currentRoom,
          }),
        );

        joined = false;
        currentRoom = null;

        updateUI();

        console.log("Left room");
      }

      // ===============================
      // COMPILE
      // ===============================
      async function compileCode() {
        const content = editor.getValue();

        try {
          const response = await fetch(
            `http://${serverHost}:${port}/api/compile`,
            {
              method: "POST",
              headers: {
                "Content-Type": "text/plain",
              },
              body: content,
            },
          );

          const result = await response.text();
          document.getElementById("output").innerText = result;
        } catch (err) {
          document.getElementById("output").innerText = "Error: " + err;
        }
      }

      // ===============================
      // SOCKET
      // ===============================
      const socket = new WebSocket(`ws://${serverHost}:${port}/ws`);
      let isRemoteUpdate = false;

      socket.onopen = () => {
        console.log("Connected to server");
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        isRemoteUpdate = true;
        applyChange(data);
        isRemoteUpdate = false;
      };

      function applyChange(change) {
        const doc = editor.getDoc();

        if (change.opType === "insert") {
          const pos = doc.posFromIndex(change.index);
          doc.replaceRange(change.value, pos);
        }

        if (change.opType === "delete") {
          const from = doc.posFromIndex(change.index);
          const to = doc.posFromIndex(change.index + change.length);
          doc.replaceRange("", from, to);
        }
      }

      // ===============================
      // SEND CHANGES
      // ===============================
      editor.on("change", (instance, changeObj) => {
        if (isRemoteUpdate || !joined) return;

        const from = changeObj.from;
        const text = changeObj.text.join("\n");
        const removed = changeObj.removed.join("\n");

        const index = instance.indexFromPos(from);

        let payload;

        if (text && text.length > 0) {
          payload = {
            type: "editor",
            opType: "insert",
            roomID: currentRoom,
            index: index,
            value: text,
          };
        } else {
          payload = {
            type: "editor",
            opType: "delete",
            roomID: currentRoom,
            index: index,
            length: removed.length,
          };
        }

        socket.send(JSON.stringify(payload));
      });

      // Initialize UI
      updateUI();
    </script>
    ```
  </body>
</html>
